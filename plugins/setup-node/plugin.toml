[plugin]
name = "setup-node"
description = "Install and configure Node.js"
version = "1.2.0"
type = "composite"
author = "dagryn"
license = "MIT"

[inputs.node-version]
description = "Node.js version to install (must be a full semver, e.g. 20.20.0)"
default = "20.20.0"

[inputs.cache]
description = "Cache node_modules directory"
default = "true"

[[step]]
name = "detect-platform"
command = """
NODE_OS="${os}"
NODE_ARCH="${arch}"
if [ "$NODE_ARCH" = "amd64" ]; then NODE_ARCH="x64"; fi

# Detect C library (glibc vs musl) for correct binary variant
NODE_LIBC=""
if [ "$NODE_OS" = "linux" ]; then
  if command -v ldd >/dev/null 2>&1 && ldd --version 2>&1 | grep -qi musl; then
    NODE_LIBC="musl"
  elif [ -f /etc/alpine-release ]; then
    NODE_LIBC="musl"
  else
    NODE_LIBC="glibc"
  fi
  echo "Platform: $NODE_OS-$NODE_ARCH ($NODE_LIBC)"
else
  echo "Platform: $NODE_OS-$NODE_ARCH"
fi
"""

[[step]]
name = "download-and-install"
command = """
NODE_VERSION="${inputs.node-version}"
REQUESTED_MAJOR=$(echo "$NODE_VERSION" | cut -d. -f1)

# Skip download if node is already available with matching major version
if command -v node >/dev/null 2>&1; then
  EXISTING=$(node --version 2>/dev/null | sed 's/^v//')
  EXISTING_MAJOR=$(echo "$EXISTING" | cut -d. -f1)
  if [ "$EXISTING_MAJOR" = "$REQUESTED_MAJOR" ]; then
    echo "Node.js v$EXISTING already available, skipping download"
    exit 0
  fi
fi

NODE_OS="${os}"
NODE_ARCH="${arch}"
if [ "$NODE_ARCH" = "amd64" ]; then NODE_ARCH="x64"; fi

# Detect musl libc (Alpine, etc.)
IS_MUSL=""
if [ "$NODE_OS" = "linux" ]; then
  if command -v ldd >/dev/null 2>&1 && ldd --version 2>&1 | grep -qi musl; then
    IS_MUSL="true"
  elif [ -f /etc/alpine-release ]; then
    IS_MUSL="true"
  fi
fi

INSTALL_DIR="$HOME/.dagryn/tools/node-$NODE_VERSION"
LOCK_DIR="$HOME/.dagryn/tools/.node-${NODE_VERSION}.lock"

# Acquire install lock (prevents parallel tasks from racing on the same directory).
# mkdir is atomic on all POSIX filesystems.
_lock_attempts=0
while ! mkdir "$LOCK_DIR" 2>/dev/null; do
  _lock_attempts=$((_lock_attempts + 1))
  if [ $_lock_attempts -gt 60 ]; then
    echo "Error: timed out waiting for install lock" >&2
    exit 1
  fi
  sleep 1
done
trap "rmdir '$LOCK_DIR' 2>/dev/null" EXIT

# Re-check after acquiring lock (another task may have completed the install)
if [ -d "$INSTALL_DIR/bin" ] && [ -f "$INSTALL_DIR/bin/node" ]; then
  if "$INSTALL_DIR/bin/node" --version >/dev/null 2>&1; then
    echo "Node.js $NODE_VERSION already installed"
    exit 0
  fi
  rm -rf "$INSTALL_DIR"
fi

# ── Strategy 1: Alpine apk (native musl package, most reliable) ──
if [ -n "$IS_MUSL" ] && command -v apk >/dev/null 2>&1; then
  echo "Installing Node.js via apk (Alpine native)..."
  if apk add --no-cache "nodejs~=${REQUESTED_MAJOR}" npm 2>/dev/null; then
    INSTALLED=$(node --version 2>/dev/null | sed 's/^v//')
    if [ -n "$INSTALLED" ]; then
      echo "Node.js v$INSTALLED installed via apk"
      exit 0
    fi
  fi
  echo "apk install failed or version not available, trying binary download..." >&2
fi

# ── Strategy 2: Unofficial musl binary build ──
if [ -n "$IS_MUSL" ]; then
  TARBALL="node-v${NODE_VERSION}-linux-${NODE_ARCH}-musl.tar.gz"
  URL="https://unofficial-builds.nodejs.org/download/release/v${NODE_VERSION}/${TARBALL}"
  echo "Downloading Node.js $NODE_VERSION (musl) from $URL"
  TMPFILE=$(mktemp)
  DOWNLOAD_OK=""
  if command -v curl >/dev/null 2>&1; then
    curl -fsSL -o "$TMPFILE" "$URL" 2>/dev/null && DOWNLOAD_OK="true"
  elif command -v wget >/dev/null 2>&1; then
    wget -q -O "$TMPFILE" "$URL" 2>/dev/null && DOWNLOAD_OK="true"
  fi
  # Validate it's actually a gzip file (servers may return HTML on 200)
  if [ "$DOWNLOAD_OK" = "true" ] && [ -s "$TMPFILE" ]; then
    _magic=$(od -A n -t x1 -N 2 "$TMPFILE" 2>/dev/null | tr -d ' ')
    if [ "$_magic" != "1f8b" ]; then
      DOWNLOAD_OK=""
    fi
  else
    DOWNLOAD_OK=""
  fi
  if [ "$DOWNLOAD_OK" = "true" ]; then
    rm -rf "$INSTALL_DIR"
    mkdir -p "$INSTALL_DIR"
    tar xzf "$TMPFILE" --strip-components=1 -C "$INSTALL_DIR" 2>/dev/null
    rm -f "$TMPFILE"
    if [ -f "$INSTALL_DIR/bin/node" ] && "$INSTALL_DIR/bin/node" --version >/dev/null 2>&1; then
      echo "Node.js $NODE_VERSION (musl) downloaded successfully"
      exit 0
    fi
    echo "musl build failed verification, trying official build..." >&2
    rm -rf "$INSTALL_DIR"
  else
    rm -f "$TMPFILE"
    echo "musl build not available for v$NODE_VERSION, trying official build..." >&2
  fi
fi

# ── Strategy 3: Official Node.js build (glibc) + compat libs on musl ──
rm -rf "$INSTALL_DIR"
mkdir -p "$INSTALL_DIR"
TARBALL="node-v${NODE_VERSION}-${NODE_OS}-${NODE_ARCH}.tar.gz"
URL="https://nodejs.org/dist/v${NODE_VERSION}/${TARBALL}"
echo "Downloading Node.js $NODE_VERSION from $URL"
TMPFILE=$(mktemp)
if command -v curl >/dev/null 2>&1; then
  curl -fsSL -o "$TMPFILE" "$URL"
elif command -v wget >/dev/null 2>&1; then
  wget -q -O "$TMPFILE" "$URL"
else
  echo "Error: curl or wget is required" >&2; exit 1
fi
if [ ! -s "$TMPFILE" ]; then
  echo "Error: failed to download $URL" >&2; rm -f "$TMPFILE"; exit 1
fi
tar xzf "$TMPFILE" --strip-components=1 -C "$INSTALL_DIR"
rm -f "$TMPFILE"
if [ ! -f "$INSTALL_DIR/bin/node" ]; then
  echo "Error: node binary not found after extraction" >&2; exit 1
fi

# On musl, the glibc binary needs compat libraries
if [ -n "$IS_MUSL" ] && ! "$INSTALL_DIR/bin/node" --version >/dev/null 2>&1; then
  if command -v apk >/dev/null 2>&1; then
    echo "Installing glibc compatibility libraries..."
    apk add --no-cache libstdc++ libgcc gcompat 2>&1 || true
  fi
fi

if ! "$INSTALL_DIR/bin/node" --version >/dev/null 2>&1; then
  echo "Error: node binary cannot execute on this system" >&2
  echo "System: $(uname -a)" >&2
  if [ -n "$IS_MUSL" ]; then
    echo "None of the following strategies worked:" >&2
    echo "  1. apk add nodejs npm (Alpine native)" >&2
    echo "  2. Unofficial musl build from unofficial-builds.nodejs.org" >&2
    echo "  3. Official glibc build + compat libs (libstdc++ libgcc gcompat)" >&2
  fi
  if command -v ldd >/dev/null 2>&1; then
    echo "Binary linkage:" >&2
    ldd "$INSTALL_DIR/bin/node" 2>&1 | head -5 >&2
  fi
  rm -rf "$INSTALL_DIR"
  exit 1
fi
echo "Node.js $NODE_VERSION downloaded successfully"
"""

[[step]]
name = "set-path"
command = """
NODE_VERSION="${inputs.node-version}"
INSTALL_DIR="$HOME/.dagryn/tools/node-$NODE_VERSION"
if [ -d "$INSTALL_DIR/bin" ]; then
  export PATH="$INSTALL_DIR/bin:$PATH"
fi
echo "Node.js $(node --version 2>/dev/null || echo 'unknown') ready"
"""
[step.env]
PATH = "$HOME/.dagryn/tools/node-${inputs.node-version}/bin:$PATH"

[[step]]
name = "cache-node-modules"
if = "${inputs.cache}"
command = """
if [ -f "package-lock.json" ] || [ -f "yarn.lock" ] || [ -f "pnpm-lock.yaml" ]; then
  echo "Lock file detected, node_modules eligible for caching"
else
  echo "No lock file found, skipping cache"
fi
"""

[[cleanup]]
name = "shell-cache-reset"
command = """
hash -r 2>/dev/null || true
echo "setup-node cleanup complete"
"""
